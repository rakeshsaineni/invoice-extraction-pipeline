name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: invoiceflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check src tests azure_function
      - name: Unit + integration tests (PostgreSQL JSONB included)
        run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/invoiceflow
      - name: Eval gate (no bad invoice may be auto-approved)
        run: invoiceflow generate -n 120 && invoiceflow eval --out reports-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports-ci/

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoice-extraction-pipeline .
